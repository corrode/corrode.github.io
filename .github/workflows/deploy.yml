name: Zola

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Serialize deploys so concurrent runs can't race when force-pushing to
# gh-pages, which can leave the GitHub Pages deployment wedged. Queue rather
# than cancel, so a half-finished push is never interrupted.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        env:
          ZOLA_VERSION: "0.22.1"
        run: |
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin
          zola --version

      - name: Build site
        if: github.event_name != 'pull_request'
        run: zola build

      - name: Build site with drafts
        if: github.event_name == 'pull_request'
        run: zola build --drafts

      - name: Validate HTML
        run: >-
          npx --yes --package vnu-jar@26.8.21 vnu
          --errors-only
          --skip-non-html
          public

      - name: Deploy
        if: github.ref == 'refs/heads/master'
        uses: shalzz/zola-deploy-action@v0.22.1
        env:
          PAGES_BRANCH: gh-pages
          BUILD_DIR: .
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
