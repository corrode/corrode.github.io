<section class="newsletter-callout skew-top" id="newsletter" aria-labelledby="newsletter-title">
  <div class="newsletter-inner">
    <h2 class="callout-title" id="newsletter-title">Idiomatic Rust content. Straight to your inbox.</h2>
    <p>
        I regularly write new articles on idiomatic Rust. If you want to be
        notified when I publish them, you should sign up to my newsletter here.
        No spam. Unsubscribe at any time.
    </p>
    <div id="newsletter-subscription">
        <form
            id="newsletter-form"
            action="https://newsletter.corrode.dev/subscribe"
            method="post"
        >
            <label for="tlemail" class="visually-hidden">Email</label>
            <input
                id="tlemail"
                type="email"
                name="email"
                placeholder="mail@example.com"
                autocomplete="email"
                required
            />
            <!-- honeypot: hidden from humans, irresistible to bots -->
            <input
                type="text"
                name="hpfield"
                style="display: none"
                tabindex="-1"
                autocomplete="off"
            />
            <button type="submit" id="newsletter-submit" disabled>
                Subscribe
            </button>
            <div id="newsletter-turnstile"></div>
            <p id="newsletter-status" role="status" aria-live="polite"></p>
        </form>
    </div>
  </div>
</section>

<script>
    (() => {
        const email = document.getElementById("tlemail");
        const submit = document.getElementById("newsletter-submit");
        const challenge = document.getElementById("newsletter-turnstile");
        const status = document.getElementById("newsletter-status");
        if (!email || !submit || !challenge || !status) return;

        const local = ["localhost", "127.0.0.1", "0.0.0.0", "[::1]"].includes(
            window.location.hostname,
        );
        let loading = false;
        let widgetId = null;
        const disableSubmit = () => {
            submit.disabled = true;
        };
        const loadTurnstile = () => {
            if (loading || widgetId !== null) return;
            loading = true;
            const script = document.createElement("script");
            script.src =
                "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
            script.async = true;
            script.onload = () => {
                widgetId = window.turnstile.render(challenge, {
                    sitekey: local
                        ? "1x00000000000000000000AA"
                        : "0x4AAAAAAEdVZvjmk2hw9PFR",
                    action: "newsletter",
                    appearance: "interaction-only",
                    theme: "auto",
                    callback: () => {
                        submit.disabled = false;
                        status.textContent = "";
                    },
                    "expired-callback": disableSubmit,
                    "timeout-callback": disableSubmit,
                    "error-callback": () => {
                        disableSubmit();
                        status.textContent =
                            "Verification failed. Please try again.";
                    },
                });
            };
            script.onerror = () => {
                loading = false;
                status.textContent =
                    "Verification could not be loaded. Please try again.";
            };
            document.head.appendChild(script);
        };

        email.addEventListener("focus", loadTurnstile);
        email.addEventListener("input", loadTurnstile);
    })();
</script>
