<div class="info">
  {% if title %}
  <div class="info-header">
    {% if icon %}
      <span class="icon icon-{{ icon }}"></span>
    {% else %}
      <span class="icon icon-info"></span>
    {% endif %}
    <p class="info-title">{{ title | markdown(inline=true) | safe }}</p>
  </div>
  {% endif %}
  {{ body | markdown() | safe }}
</div>
