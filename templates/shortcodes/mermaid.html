<pre class="mermaid">
{{ body }}
</pre>
{% if nth == 1 %}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({
    startOnLoad: true,
    theme: "neutral",
    securityLevel: "strict",
    flowchart: { htmlLabels: true, useMaxWidth: true },

</script>
{% endif %}
